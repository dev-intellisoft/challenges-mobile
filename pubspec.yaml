name: taski
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.5.1
dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  provider: ^6.1.1 # ou GetX, Riverpod, etc.
  uuid: ^4.0.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/icons/no_task_icon.svg
  fonts:
    - family: 'Urbanist'
      fonts:
        - asset: assets/fonts/Urbanist-Regular.ttf
          weight: 700